services:
  db:
    image: mysql:5.7
    container_name: bibliography-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bibl_new
    volumes:
      - db-data:/var/lib/mysql
      - ./db/bibl_new.sql:/docker-entrypoint-initdb.d/001_bibl_new.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bibliography-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/bibl_new
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required. Copy .env.example to .env and set SECRET_KEY.}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PDF_STORAGE_DIR: /app/db/pdf
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./db:/app/db
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    depends_on:
      db:
        condition: service_healthy

  ai-agent:
    build:
      context: ./backend-ai
    container_name: bibliography-ai-agent
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/bibl_new
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AI_LLM_ENABLED: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b-instruct
    ports:
      - "8001:8001"
    volumes:
      - ./backend-ai/app:/app/app
      - ./backend-ai/scripts:/app/scripts
      - ./backend:/backend:ro
      - ./db:/app/db
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--reload-dir", "/app/app"]
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: bibliography-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: bibliography-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
      VITE_AI_API_BASE_URL: http://127.0.0.1:8001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
  frontend-node-modules:
  ollama-data:
